<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hardline Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #111318;
        --panel: #181b22;
        --panel-2: #20242d;
        --line: #303642;
        --text: #e7eaf0;
        --muted: #9aa3b2;
        --accent: #4fb3a5;
        --danger: #dc6b6b;
        --warn: #d7a84f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
        min-height: 100%;
      }

      body.full-mode {
        display: block;
        min-height: 100%;
        overflow: hidden;
      }

      body.full-mode aside,
      body.full-mode .toolbar,
      body.full-mode .meta-grid,
      body.full-mode .statusbar {
        display: none;
      }

      body.full-mode main {
        display: block;
        width: 100vw;
        height: 100vh;
        min-height: 100vh;
      }

      body.full-mode #terminal {
        width: 100vw;
        height: 100vh;
      }

      aside {
        min-width: 0;
        border-right: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 48px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        min-height: 32px;
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      button:disabled {
        cursor: not-allowed;
        color: #626a78;
        border-color: #292f3a;
      }

      button.with-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }

      .with-icon svg {
        width: 14px;
        height: 14px;
        flex: 0 0 auto;
      }

      .danger:hover {
        border-color: var(--danger);
        color: #ffb8b8;
      }

      form {
        display: grid;
        gap: 8px;
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }

      .slug-control {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 34px;
        gap: 6px;
        align-items: end;
      }

      label {
        display: grid;
        gap: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      input,
      select {
        width: 100%;
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0f1116;
        color: var(--text);
        padding: 7px 9px;
      }

      .icon-button {
        width: 34px;
        padding: 0;
      }

      .session-list {
        overflow: auto;
        padding: 8px;
      }

      .session-row {
        margin: 0 0 6px;
      }

      .session-select {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 6px;
        min-width: 0;
        width: 100%;
        text-align: left;
      }

      .session-select.active {
        border-color: var(--accent);
        background: #17302f;
      }

      .session-name,
      .session-meta,
      .meta-value {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .session-name {
        font-weight: 650;
      }

      .session-meta {
        color: var(--muted);
        font-size: 12px;
      }

      .status-dot {
        align-self: center;
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #5b6370;
        box-shadow: 0 0 0 3px rgba(91, 99, 112, 0.14);
      }

      .status-dot.up {
        background: #43d17d;
        box-shadow: 0 0 0 3px rgba(67, 209, 125, 0.16);
      }

      .status-dot.down {
        background: var(--danger);
        box-shadow: 0 0 0 3px rgba(220, 107, 107, 0.16);
      }

      main {
        min-width: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        min-height: 48px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
      }

      .title {
        min-width: 0;
      }

      .title strong,
      .title span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .title span {
        color: var(--muted);
        font-size: 12px;
        margin-top: 2px;
      }

      .toolbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #terminal {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: #101014;
      }

      .statusbar {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, auto)) minmax(0, 1fr);
        gap: 12px;
        align-items: center;
        min-height: 32px;
        padding: 6px 12px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }

      .meta-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1px;
        background: var(--line);
        border-bottom: 1px solid var(--line);
      }

      .meta-cell {
        min-width: 0;
        padding: 7px 10px;
        background: var(--panel);
      }

      .meta-label {
        color: var(--muted);
        font-size: 11px;
        margin-bottom: 2px;
      }

      .empty {
        padding: 14px 12px;
        color: var(--muted);
        font-size: 13px;
      }

      .full-back {
        display: none;
        position: fixed;
        top: 8px;
        right: 10px;
        z-index: 20;
        color: var(--muted);
        background: rgba(16, 16, 20, 0.82);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 8px;
        font-size: 12px;
        text-decoration: none;
      }

      body.full-mode .full-back {
        display: block;
      }

      .full-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 30;
        place-items: center;
        padding: 24px;
        background: rgba(17, 19, 24, 0.94);
        color: var(--text);
        text-align: center;
      }

      body.full-mode .full-overlay:not([hidden]) {
        display: grid;
      }

      .full-overlay strong {
        display: block;
        margin-bottom: 10px;
        font-size: 16px;
      }

      .full-overlay a {
        color: var(--accent);
      }

      @media (max-width: 760px) {
        body {
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(0, 1fr);
        }

        aside {
          max-height: 42vh;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .meta-grid,
        .statusbar {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <aside>
      <header>
        <h1>Hardline</h1>
        <button id="refresh" class="with-icon" type="button" data-testid="refresh-button">
          <i data-lucide="refresh-cw" aria-hidden="true"></i>
          <span>Refresh</span>
        </button>
      </header>

      <form id="create-form" data-testid="create-form">
        <div class="slug-control">
          <label>
            Slug
            <input id="slug" name="slug" autocomplete="off" spellcheck="false" placeholder="mango-scout" data-testid="slug-input" />
          </label>
          <button id="slug-reroll" class="icon-button with-icon" type="button" title="Suggest slug" aria-label="Suggest slug" data-testid="slug-reroll-button">
            <i data-lucide="shuffle" aria-hidden="true"></i>
          </button>
        </div>
        <label>
          Shell
          <select id="command-preset" name="command-preset" data-testid="command-preset">
            <option value="" selected>Default tmux shell</option>
            <option value="/bin/zsh -l">zsh login shell</option>
            <option value="/bin/zsh">zsh</option>
            <option value="/bin/zsh -f">zsh fast shell</option>
          </select>
        </label>
        <button class="with-icon" type="submit" data-testid="create-button">
          <i data-lucide="plus" aria-hidden="true"></i>
          <span>New</span>
        </button>
      </form>

      <div id="session-list" class="session-list" data-testid="session-list"></div>
    </aside>

    <main>
      <div class="toolbar">
        <div class="title">
          <strong id="active-title">No session selected</strong>
          <span id="active-subtitle">Create or select a hardline session</span>
        </div>
        <div class="toolbar-actions">
          <button id="open-full" class="with-icon" type="button" disabled data-testid="open-full-button">
            <i data-lucide="external-link" aria-hidden="true"></i>
            <span>Open Full</span>
          </button>
          <button id="stop" class="danger with-icon" type="button" disabled data-testid="stop-button">
            <i data-lucide="square" aria-hidden="true"></i>
            <span>Stop</span>
          </button>
        </div>
      </div>

      <div class="meta-grid">
        <div class="meta-cell">
          <div class="meta-label">tmux</div>
          <div id="meta-session" class="meta-value">-</div>
        </div>
        <div class="meta-cell">
          <div class="meta-label">session id</div>
          <div id="meta-session-id" class="meta-value">-</div>
        </div>
        <div class="meta-cell">
          <div class="meta-label">pane pid</div>
          <div id="meta-pane-pid" class="meta-value">-</div>
        </div>
        <div class="meta-cell">
          <div class="meta-label">command</div>
          <div id="meta-command" class="meta-value">-</div>
        </div>
      </div>

      <div id="terminal" data-testid="terminal"></div>
      <a id="full-back" class="full-back" href="/">Manager</a>
      <div id="full-overlay" class="full-overlay" hidden data-testid="full-overlay">
        <div>
          <strong id="full-overlay-title">Session unavailable</strong>
          <div id="full-overlay-message"></div>
          <p><a href="/">Back to manager</a></p>
        </div>
      </div>

      <div class="statusbar">
        <span id="socket-status" data-testid="socket-status">socket: idle</span>
        <span id="size-status" data-testid="size-status">size:100x32</span>
        <span id="input-status" data-testid="input-status">in:0</span>
        <span id="output-status" data-testid="output-status">out:0/0B</span>
        <span id="dup-status" data-testid="dup-status">dup:0</span>
        <span id="message-status" data-testid="message-status"></span>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/phoenix@1.8.5/priv/static/phoenix.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script type="module" src="/js/hardline_boot.js"></script>
  </body>
</html>
